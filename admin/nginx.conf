# nginx del panel admin: sirve la SPA estática y hace proxy de /api al contenedor
# `api` (mismo origen -> el navegador no necesita CORS para el panel).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad para el panel (la API pone las suyas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: cualquier ruta cae en index.html (react-admin usa hash router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy del API al contenedor interno `api` (puerto 8080).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        client_max_body_size 50m;
    }
}
